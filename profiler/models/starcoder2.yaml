# StarCoder2 family — class catalog (dense decoder-only code LLMs).
#
# Covers every StarCoder2 checkpoint (3B / 7B / 15B). Pick the
# specific model at the CLI.
#
# Differences from Llama/Qwen3:
#   * LayerNorm (norm_type=layer_norm), not RMSNorm.
#   * MLP input is a single ColumnParallelLinear (c_fc), not the
#     fused MergedColumnParallelLinear.
#   * Activation is nn.GELU(tanh), class name ``GELU``, not SiluAndMul.
#   * No per-head QK normalization (no ``qk_norm``).
#   * use_bias=true, sliding_window attention.
#
# Canonical layer names mirror vLLM's attribute names (see
# ../vllm/vllm/model_executor/models/starcoder2.py).

sequence:
  prologue:  [embedding]
  pre_attn:  [layernorm, qkv_proj, rotary_emb, attention]
  post_attn: [o_proj, layernorm]
  mlp_dense: [gate_up_proj, act_fn, down_proj]
  mlp_moe:   []
  head:      [final_layernorm, lm_head, sampler]

catalog:
  dense:
    embedding:
      vllm: VocabParallelEmbedding
    layernorm:
      vllm: LayerNorm
      within: Starcoder2DecoderLayer
      tp_stable: true
    qkv_proj:
      vllm: QKVParallelLinear
    rotary_emb:
      vllm: RotaryEmbedding
    o_proj:
      vllm: RowParallelLinear
      within: Starcoder2Attention
    gate_up_proj:
      vllm: ColumnParallelLinear
      within: Starcoder2MLP
    act_fn:
      vllm: GELU
    down_proj:
      vllm: RowParallelLinear
      within: Starcoder2MLP
    final_layernorm:
      vllm: LayerNorm
      within: Starcoder2Model
      tp_stable: true
  per_sequence:
    lm_head:
      vllm: LogitsProcessor
    sampler:
      vllm: Sampler
      tp_stable: true
  attention:
    attention:
      vllm: Attention
